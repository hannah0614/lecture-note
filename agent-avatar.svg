<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B4B"/>
      <stop offset="100%" style="stop-color:#312E81"/>
    </linearGradient>
    <!-- 主色渐变 -->
    <linearGradient id="main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#C084FC"/>
    </linearGradient>
    <!-- 光晕 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- 光晕 -->
  <circle cx="256" cy="210" r="180" fill="url(#glow)"/>

  <!-- 声波纹 - 左侧 -->
  <path d="M 140 180 C 140 150, 140 130, 140 130" stroke="url(#main)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M 150 200 C 150 140, 150 120, 150 120" stroke="url(#main)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 160 220 C 160 130, 160 110, 160 110" stroke="url(#main)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- 语音波形 -->
  <rect x="200" y="150" width="16" height="40" rx="8" fill="#A5B4FC" opacity="0.6"/>
  <rect x="224" y="130" width="16" height="80" rx="8" fill="#A5B4FC" opacity="0.7"/>
  <rect x="248" y="110" width="16" height="120" rx="8" fill="#C084FC" opacity="0.8"/>
  <rect x="272" y="130" width="16" height="80" rx="8" fill="#A5B4FC" opacity="0.7"/>
  <rect x="296" y="150" width="16" height="40" rx="8" fill="#A5B4FC" opacity="0.6"/>

  <!-- AI 笔/笔记图标 - 右侧 (修复 clip-path 为完整的矩形) -->
  <g transform="translate(30, 0)">
    <!-- 笔记页面 (有折角效果) -->
    <rect x="310" y="175" width="100" height="130" rx="12" fill="#E0E7FF" opacity="0.95"/>
    <!-- 折角 -->
    <path d="M 390 175 L 390 200 L 410 200" fill="#C7D2FE"/>
    <!-- 直线 (笔记内容) -->
    <line x1="330" y1="200" x2="370" y2="200" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="330" y1="220" x2="380" y2="220" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="330" y1="240" x2="365" y2="240" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="330" y1="260" x2="375" y2="260" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
    <!-- 勾选标记 -->
    <path d="M 330 280 L 340 288 L 358 268" stroke="#34D399" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AI 火花 ✦ 右下角 -->
  <g transform="translate(8, 0)">
    <path d="M 410 295 L 414 275 L 434 271 L 414 267 L 410 247 L 406 267 L 386 271 L 406 275 Z" fill="#FBBF24" opacity="0.9"/>
    <!-- 小火花 -->
    <path d="M 395 305 L 398 292 L 411 289 L 398 286 L 395 273 L 392 286 L 379 289 L 392 292 Z" fill="#FDE68A" opacity="0.7"/>
  </g>

  <!-- 底部文字 -->
  <text x="256" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#A5B4FC" letter-spacing="4">
    LECTURENOTE
  </text>
</svg>
